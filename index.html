<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lepide Console</title>
<link rel="icon" href="/lepide-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('lepide.theme');document.documentElement.dataset.theme=(t==='dark'||t==='hc')?t:'light';if(localStorage.getItem('lepide.dockCollapsed')==='1')document.documentElement.dataset.dock='collapsed';}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
