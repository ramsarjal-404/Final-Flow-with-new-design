<!doctype html>
<!-- Generated by examples/build-html.mjs from html/src/ — a Lepide Design System golden example. Edit the source page. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Lepide</title>
<link rel="stylesheet" href="lepide.css">
</head>
<body>
<div class="app lf">
  <section class="view login-page">
    <div class="stage">
      <div class="auth">
        <div class="card">
          <div class="screen active">
            <div class="logo"><img src="lepide-mark.svg" alt="Lepide"></div>
            <p class="auth-eyebrow">Lepide · Data Security Platform</p>
            <h1>Sign in to the console</h1>

            <form action="/sign-in" method="post">
              <div class="field">
                <label for="signin-email">Email</label>
                <div class="input-icon">
                  <svg class="lf-i lead-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  <input id="signin-email" name="email" type="email" autocomplete="username" placeholder="name@company.com" required>
                </div>
              </div>

              <div class="field">
                <div class="row-label">
                  <label for="signin-password">Password</label>
                  <a href="/forgot-password">Forgot password?</a>
                </div>
                <div class="input-icon">
                  <svg class="lf-i lead-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                  <button type="button" class="eye" aria-pressed="false" aria-label="Show password"><svg class="lf-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
                <!-- With script, an empty submit adds class="invalid" to the input and shows this line:
                <p class="err-line" id="signin-password-err" role="alert"><svg class="lf-i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Enter your password.</p> -->
              </div>

              <button type="submit" class="btn"><span class="btn__icon"><svg class="lf-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span>Sign in</span></button>
            </form>

            <p class="foot">Need access? Ask an administrator.</p>
          </div>
        </div>

        <!-- The illustration: lepide-art.js fills the canvas with the particle animation (the Lepide mark, then each
             module's icon) and writes the caption and the dots. Keep this markup as it is. -->
        <div class="auth__art">
          <div class="security-background"><canvas aria-hidden="true"></canvas></div>
          <p class="art__hint" aria-hidden="true">Move through the data to scatter it · click to jump ahead</p>
          <div class="art__copy is-out" aria-live="polite"><p class="art__kicker"></p><h2 class="art__title"></h2><p class="art__text"></p></div>
          <div class="art__nav" role="group" aria-label="How Lepide helps"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script src="lepide.js" defer></script>
<script src="lepide-art.js" defer></script>
</body>
</html>
